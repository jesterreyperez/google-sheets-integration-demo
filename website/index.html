<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Sheets Integration Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Google Sheets Form Demo</h1>
    <form id="demoForm" novalidate>
      <label>
        Name: <input id="name" name="name" required />
        <span class="error" id="nameError" aria-live="polite"></span> </label
      ><br />
      <label>
        Email: <input id="email" name="email" type="email" required />
        <span class="error" id="emailError" aria-live="polite"></span></label
      ><br />
      <button id="submitBtn" type="submit">Submit</button>
    </form>
    <p id="status" aria-live="polite"></p>
    <div id="animWrap" aria-hidden="true">
      <div id="spinner" class="hidden" aria-hidden="true"></div>
      <div id="check" class="hidden" aria-hidden="true">
        <svg viewBox="0 0 52 52" class="checkmark" aria-hidden="true">
          <circle
            class="checkmark__circle"
            cx="26"
            cy="26"
            r="25"
            fill="none"
          />
          <path class="checkmark__check" fill="none" d="M14 27 l7 7 l16 -16" />
        </svg>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
